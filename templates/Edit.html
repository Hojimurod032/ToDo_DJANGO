<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Task — DoTask</title>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">

    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --surface2: #1a1a26;
            --border: #2a2a3a;
            --accent: #ff3c5e;
            --accent2: #7b2fff;
            --text: #e8e8f0;
            --muted: #6b6b80;
            --input-bg: #1a1a26;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
        }

        .edit-container {
            width: 100%;
            max-width: 520px;
        }

        .edit-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 34px;
            position: relative;
            overflow: hidden;
            animation: cardIn .35s ease;
        }

        .edit-card::before {
            content: '';
            position: absolute;
            inset: 0 0 auto 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent2), var(--accent));
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .top-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--muted);
            margin-bottom: 22px;
            font-size: 14px;
            transition: .2s;
        }

        .top-back:hover {
            color: var(--accent);
            transform: translateX(-3px);
        }

        .title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 40px;
            letter-spacing: 3px;
            margin-bottom: 24px;
        }

        .title span {
            color: var(--accent2);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            color: var(--text);
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: .25s;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(255, 60, 94, 0.08);
        }

        .save-btn {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 15px;
            margin-top: 10px;
            cursor: pointer;

            background: linear-gradient(135deg, var(--accent2), var(--accent));

            color: white;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            letter-spacing: 2px;

            transition: .25s;
            box-shadow: 0 10px 30px rgba(123, 47, 255, 0.25);
        }

        .save-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 16px 40px rgba(123, 47, 255, 0.35);
        }

        .mini-info {
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 18px;
            }

            .edit-card {
                padding: 24px;
                border-radius: 20px;
            }

            .title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

<div class="edit-container">

    <div class="edit-card">

        <a href="{% url 'home' %}" class="top-back">
            ← Orqaga qaytish
        </a>

        <div class="title">
            TASK <span>EDIT</span>
        </div>

        <form method="POST" action="{% url 'edit' todos.id %}">
            {% csrf_token %}

            <div class="form-group">
                <label>Vazifa nomi</label>
                <input type="text"
                       name="title"
                       value="{{ todos.title }}"
                       placeholder="Vazifa nomi..."
                       required>
            </div>

            <div class="form-group">
                <label>Tavsif</label>
                <textarea name="description"
                          placeholder="Qo'shimcha ma'lumot...">{{ todos.desc }}</textarea>
            </div>

            <div class="form-group">
                <label>Status</label>

                <select name="status">
                    <option value="Kutilmoqda"
                            {% if todos.status == "Kutilmoqda" %}selected{% endif %}>
                        🕒 Kutilmoqda
                    </option>

                    <option value="Bajarilmoqda"
                            {% if todos.status == "Bajarilmoqda" %}selected{% endif %}>
                        🔥 Bajarilmoqda
                    </option>

                    <option value="Bajarildi"
                            {% if todos.status == "Bajarildi" %}selected{% endif %}>
                        ✅ Bajarildi
                    </option>

                </select>
            </div>

            <div class="form-group">
                <label>Kategoriya</label>

                <select name="category">
                    <option value="Umumiy" {% if todos.cate == "Umumiy" %}selected{% endif %}>📌 Umumiy</option>

                    <option value="Ish" {% if todos.cate == "Ish" %}selected{% endif %}>💼 Ish</option>

                    <option value="Oquv" {% if todos.cate == "Oquv" %}selected{% endif %}>📚 O‘quv</option>

                    <option value="Shaxsiy" {% if todos.cate == "Shaxsiy" %}selected{% endif %}>👤 Shaxsiy</option>

                    <option value="Sport" {% if todos.cate == "Sport" %}selected{% endif %}>🏃 Sport</option>

                    <option value="Dasturlash" {% if todos.cate == "Dasturlash" %}selected{% endif %}>💻 Dasturlash
                    </option>

                    <option value="Dizayn" {% if todos.cate == "Dizayn" %}selected{% endif %}>🎨 Dizayn</option>

                    <option value="Moliya" {% if todos.cate == "Moliya" %}selected{% endif %}>💰 Moliya</option>

                    <option value="Soglik" {% if todos.cate == "Soglik" %}selected{% endif %}>🩺 Sog‘liq</option>

                    <option value="Sayohat" {% if todos.cate == "Sayohat" %}selected{% endif %}>✈️ Sayohat</option>

                    <option value="Ovqat" {% if todos.cate == "Ovqat" %}selected{% endif %}>🍔 Ovqat</option>

                    <option value="Musiqa" {% if todos.cate == "Musiqa" %}selected{% endif %}>🎵 Musiqa</option>

                    <option value="Film" {% if todos.cate == "Film" %}selected{% endif %}>🎬 Film</option>

                    <option value="Kitob" {% if todos.cate == "Kitob" %}selected{% endif %}>📖 Kitob</option>

                    <option value="Uy" {% if todos.cate == "Uy" %}selected{% endif %}>🏠 Uy ishlari</option>

                    <option value="Shopping" {% if todos.cate == "Shopping" %}selected{% endif %}>🛒 Shopping</option>

                    <option value="Oyin" {% if todos.cate == "Oyin" %}selected{% endif %}>🎮 O‘yin</option>

                    <option value="Mashina" {% if todos.cate == "Mashina" %}selected{% endif %}>🚗 Mashina</option>

                    <option value="Fitness" {% if todos.cate == "Fitness" %}selected{% endif %}>🏋️ Fitness</option>

                    <option value="Uchrashuv" {% if todos.cate == "Uchrashuv" %}selected{% endif %}>📅 Uchrashuv</option>

                    <option value="Telegram" {% if todos.cate == "Telegram" %}selected{% endif %}>📱 Telegram</option>

                    <option value="Internet" {% if todos.cate == "Internet" %}selected{% endif %}>🌐 Internet</option>

                    <option value="Startup" {% if todos.cate == "Startup" %}selected{% endif %}>🚀 Startup</option>

                    <option value="AI" {% if todos.cate == "AI" %}selected{% endif %}>🤖 AI</option>

                    <option value="Muhim" {% if todos.cate == "Muhim" %}selected{% endif %}>⚡ Muhim</option>
                </select>
            </div>

            <button type="submit" class="save-btn">
                SAQLASH
            </button>

        </form>

        <div class="mini-info">
            DoTask • Edit Mode ⚡
        </div>

    </div>

</div>

</body>
</html>
