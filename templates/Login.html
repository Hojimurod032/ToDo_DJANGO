<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoTask — Kirish</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #12121a;
            --border: #2a2a3a;
            --accent: #ff3c5e;
            --accent2: #7b2fff;
            --text: #e8e8f0;
            --muted: #6b6b80;
            --input-bg: #1a1a26;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* LEFT PANEL */
        .left-panel {
            width: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 60, 94, 0.25) 0%, transparent 60%),
            radial-gradient(ellipse at 70% 80%, rgba(123, 47, 255, 0.2) 0%, transparent 60%);
        }

        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255, 60, 94, 0.07) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 60, 94, 0.07) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        }

        .brand {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .brand-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 96px;
            line-height: 1;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ff3c5e 0%, #ff7a3d 50%, #7b2fff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(255, 60, 94, 0.4));
        }

        .brand-sub {
            font-size: 13px;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 8px;
        }

        .deco-line {
            width: 80px;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            margin: 20px auto;
            border-radius: 2px;
        }

        .tagline {
            font-size: 15px;
            color: var(--muted);
            max-width: 260px;
            line-height: 1.7;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        .shape-1 {
            width: 200px;
            height: 200px;
            background: rgba(255, 60, 94, 0.15);
            top: 10%;
            left: 5%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 150px;
            height: 150px;
            background: rgba(123, 47, 255, 0.15);
            bottom: 15%;
            right: 10%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* RIGHT PANEL */
        .right-panel {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            border-left: 1px solid var(--border);
            position: relative;
            overflow-y: auto;
        }

        .right-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
        }

        .form-box {
            width: 100%;
            max-width: 380px;
            animation: slideUp 0.6s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 48px;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .form-title span {
            color: var(--accent);
        }

        .form-desc {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 36px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 16px;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 14px 14px 42px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            -webkit-appearance: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 60, 94, 0.1);
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            font-size: 13px;
            gap: 8px;
        }

        .remember-row label {
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0;
            text-transform: none;
            color: var(--muted);
            cursor: pointer;
            margin: 0;
            font-size: 13px;
        }

        .remember-row a {
            color: var(--accent);
            text-decoration: none;
            font-size: 13px;
            white-space: nowrap;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent), #c8203d);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 20px;
            letter-spacing: 3px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            box-shadow: 0 8px 30px rgba(255, 60, 94, 0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 60, 94, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin: 24px 0;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: var(--border);
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .link-row {
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }

        .link-row a {
            color: var(--accent2);
            text-decoration: none;
            font-weight: 600;
        }

        .link-row a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: rgba(255, 60, 94, 0.1);
            border: 1px solid rgba(255, 60, 94, 0.3);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 20px;
            display: none;
        }

        .error-msg.show {
            display: block;
        }

        /* =====================
           MOBILE RESPONSIVE
        ===================== */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow: auto;
            }

            .left-panel {
                width: 100%;
                min-height: 220px;
                padding: 40px 20px 32px;
                border-bottom: 1px solid var(--border);
            }

            .left-panel::before {
                background: radial-gradient(ellipse at 50% 60%, rgba(255, 60, 94, 0.22) 0%, transparent 70%),
                            radial-gradient(ellipse at 80% 20%, rgba(123, 47, 255, 0.15) 0%, transparent 60%);
            }

            .brand-logo {
                font-size: 64px;
                letter-spacing: 3px;
            }

            .brand-sub {
                font-size: 11px;
                letter-spacing: 4px;
            }

            .deco-line {
                margin: 14px auto;
                width: 60px;
            }

            .tagline {
                font-size: 13px;
                max-width: 240px;
            }

            .shape-1 {
                width: 120px;
                height: 120px;
                top: 5%;
                left: 0%;
            }

            .shape-2 {
                width: 90px;
                height: 90px;
                bottom: 5%;
                right: 2%;
            }

            .right-panel {
                width: 100%;
                padding: 32px 20px 48px;
                border-left: none;
                border-top: none;
                overflow-y: visible;
            }

            .right-panel::before {
                display: none;
            }

            .form-box {
                max-width: 100%;
            }

            .form-title {
                font-size: 38px;
            }

            .form-desc {
                font-size: 13px;
                margin-bottom: 28px;
            }

            .remember-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                margin-bottom: 22px;
            }

            .remember-row p {
                font-size: 12px;
                color: var(--muted);
            }

            input[type="text"],
            input[type="email"],
            input[type="password"] {
                font-size: 16px; /* prevents iOS zoom */
                padding: 13px 13px 13px 42px;
            }

            .btn-primary {
                font-size: 18px;
                padding: 14px;
            }
        }

        @media (max-width: 400px) {
            .brand-logo {
                font-size: 52px;
            }

            .form-title {
                font-size: 32px;
            }

            .left-panel {
                min-height: 180px;
                padding: 30px 16px 24px;
            }

            .right-panel {
                padding: 24px 16px 40px;
            }
        }
    </style>
</head>
<body>
{% include "Error.html" %}

<div class="left-panel">
    <div class="grid-bg"></div>
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="brand">
        <div class="brand-logo">DoTask</div>
        <div class="deco-line"></div>
        <div class="brand-sub">Vazifalar boshqaruvi</div>
        <p class="tagline">Maqsadlaringizni tartibli boshqaring. Har bir kun — yangi g'alaba.</p>
    </div>
</div>

<div class="right-panel">
    <div class="form-box">
        <form action="{% url 'login' %}" method="post">
            {% csrf_token %}
            <h1 class="form-title">XUSH<span>OMAD</span></h1>
            <p class="form-desc">Hisobingizga kiring va vazifalaringizni boshqaring.</p>
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrap">
                    <span class="icon">✉</span>
                    <input type="text" name="email" placeholder="email@example.com">
                </div>
            </div>
            <div class="form-group">
                <label>Parol</label>
                <div class="input-wrap">
                    <span class="icon">🔒</span>
                    <input type="password" name="password" placeholder="••••••••">
                </div>
            </div>
            <div class="remember-row">
                <label><input type="checkbox"> Eslab qol</label>
                <a href="">Parolni unutdingizmi?</a>
            </div>
            <button class="btn-primary" type="submit">KIRISH</button>
            <div class="divider">yoki</div>
            <div class="link-row">
                Hisob yo'qmi? <a href="{% url 'register' %}">Ro'yxatdan o'ting →</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
